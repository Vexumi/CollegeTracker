<div class="row" [class.right]="message.sender.id === currentUserId">
    <div class="block">
        <span class="block__header">{{ message.sender.fullname }}</span>
        <span class="block__content">
            {{ message.content }}
            <span class="block__footer">{{ message.sendDate | date: "dd.MM.yyyy hh:mm:ss" }}</span>
        </span>
    </div>
</div>
